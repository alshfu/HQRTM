{% extends "base.html" %}
{% block title %}{{ t('login.title') }}{% endblock %}

{% block body %}
<div class="absolute top-4 right-5">{% include "_lang.html" %}</div>
<div class="min-h-screen grid place-items-center px-6">
  <form id="form" class="card w-full max-w-sm rounded-2xl p-7 flex flex-col gap-4" novalidate>
    <a href="/" class="font-extrabold text-xl">HQRTM</a>
    <div>
      <h1 class="text-2xl font-bold">{{ t('login.h1') }}</h1>
      <p class="text-sm text-gray-400 mt-1">{{ t('login.lead') }}</p>
    </div>

    <label class="text-sm font-medium">{{ t('common.email') }}
      <input name="email" type="email" required placeholder="{{ t('common.email_placeholder') }}"
             class="input w-full mt-1 px-3 py-2.5 rounded-lg" />
    </label>
    <label class="text-sm font-medium">{{ t('common.password') }}
      <input name="password" type="password" required placeholder="••••••••"
             class="input w-full mt-1 px-3 py-2.5 rounded-lg" />
    </label>

    <button class="btn-accent font-semibold py-2.5 rounded-lg mt-1">{{ t('login.submit') }}</button>
    <p class="text-center text-sm text-gray-400">
      {{ t('login.no_account') }} <a href="/register" class="text-accent hover:underline">{{ t('login.register_link') }}</a>
    </p>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (HQRTM.isAuthed()) location.href = "/app";
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const { ok, data } = await HQRTM.login(f.email.value.trim(), f.password.value);
    if (ok) { location.href = "/app"; }
    else { HQRTM.toast(HQRTM.t(data?.error === "invalid_credentials" ? "login.err_credentials" : "login.err_failed"), "error"); }
  });
</script>
{% endblock %}
