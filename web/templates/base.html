<!DOCTYPE html>
<html lang="{{ locale }}" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}HQRTM{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Production Tailwind-bygge (purged + minified). Källa: frontend-build/ (input.css +
       tailwind.config.js). Ombyggnad: cd frontend-build && npm run build. Tema (accent/typsnitt)
       och komponenter (.card/.input/.btn-accent/.navlink) — i bygget, inte inline. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  {% block head %}{% endblock %}
</head>
<body class="font-sans min-h-screen antialiased">
  {% block body %}{% endblock %}

  <!-- toasts -->
  <div id="toasts" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- i18n: katalog för aktuell locale → tillgänglig i inline-JS via HQRTM.t() -->
  <script>
    window.HQRTM_I18N = {{ i18n_catalog | tojson }};
    window.HQRTM_LOCALE = "{{ locale }}";
  </script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
