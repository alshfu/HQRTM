{% extends "app_base.html" %}
{% block title %}Flöde — HQRTM{% endblock %}
{% block heading %}Flöde{% endblock %}
{% block subheading %}Bostäder som matchat dina filter.{% endblock %}

{% block app %}
<div class="flex items-center gap-3 mb-4 text-sm">
  <label class="flex items-center gap-2 text-gray-400">
    <input type="checkbox" id="only-matched" checked /> Endast matchade
  </label>
  <button id="reload" class="card px-3 py-1.5 rounded-lg hover:border-white/30">Uppdatera</button>
  <span id="count" class="font-mono text-xs text-gray-500"></span>
</div>

<div id="feed" class="grid gap-3"></div>
<div id="empty" class="card rounded-xl p-8 text-center text-gray-400 hidden">Inga bostäder ännu.</div>
{% endblock %}

{% block app_scripts %}
<script>
  const feed = document.getElementById("feed");
  const empty = document.getElementById("empty");

  function card(it) {
    const meta = [it.district, it.rooms ? it.rooms + " rok" : null, it.area_m2 ? it.area_m2 + " m²" : null,
                  it.rent ? it.rent + " kr/mån" : null].filter(Boolean).map(HQRTM.esc).join(" · ");
    const fcfs = it.listing_type === "fcfs"
      ? '<span class="text-[10px] font-mono px-2 py-0.5 rounded-full" style="background:#15b87822;color:#15b878">FÖRST TILL KVARN</span>' : "";
    return `<a href="${HQRTM.esc(it.url)}" target="_blank" rel="noopener"
      class="card rounded-xl p-4 flex items-center justify-between hover:border-white/30">
      <div><div class="font-semibold">${HQRTM.esc(it.title)} ${fcfs}</div>
      <div class="text-sm text-gray-400 mt-0.5">${meta}</div>
      <div class="text-[11px] font-mono text-gray-600 mt-1">${HQRTM.esc(it.source)}</div></div>
      <span class="text-accent text-sm">Öppna →</span></a>`;
  }

  async function load() {
    const matched = document.getElementById("only-matched").checked ? "?matched=true" : "";
    const { ok, data } = await HQRTM.api("/api/listings" + matched);
    if (!ok) return HQRTM.toast("Kunde inte ladda flödet", "error");
    feed.innerHTML = data.items.map(card).join("");
    empty.classList.toggle("hidden", data.items.length > 0);
    document.getElementById("count").textContent = data.total + " st";
  }

  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("only-matched").addEventListener("change", load);
  load();
</script>
{% endblock %}
