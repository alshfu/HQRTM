{% extends "app_base.html" %}
{% block title %}Flöde — HQRTM{% endblock %}
{% block heading %}Flöde{% endblock %}
{% block subheading %}Bostäder som matchat dina filter.{% endblock %}

{% block app %}
<div class="flex items-center gap-3 mb-4 text-sm">
  <label class="flex items-center gap-2 text-gray-400">
    <input type="checkbox" id="only-matched" checked /> Endast matchade
  </label>
  <button id="reload" class="card px-3 py-1.5 rounded-lg hover:border-white/30">Uppdatera</button>
  <span id="count" class="font-mono text-xs text-gray-500"></span>
  <span id="live" class="ml-auto font-mono text-xs flex items-center gap-1.5 text-gray-500">
    <span id="live-dot" class="w-2 h-2 rounded-full" style="background:#9aa6a1"></span><span id="live-label">ansluter…</span>
  </span>
</div>

<div id="feed" class="grid gap-3"></div>
<div id="empty" class="card rounded-xl p-8 text-center text-gray-400 hidden">Inga bostäder ännu.</div>
{% endblock %}

{% block app_scripts %}
<script>
  const feed = document.getElementById("feed");
  const empty = document.getElementById("empty");

  function card(it) {
    const meta = [it.district, it.rooms ? it.rooms + " rok" : null, it.area_m2 ? it.area_m2 + " m²" : null,
                  it.rent ? it.rent + " kr/mån" : null].filter(Boolean).map(HQRTM.esc).join(" · ");
    const fcfs = it.listing_type === "fcfs"
      ? '<span class="text-[10px] font-mono px-2 py-0.5 rounded-full" style="background:#15b87822;color:#15b878">FÖRST TILL KVARN</span>' : "";
    return `<a href="${HQRTM.esc(it.url)}" target="_blank" rel="noopener"
      class="card rounded-xl p-4 flex items-center justify-between hover:border-white/30">
      <div><div class="font-semibold">${HQRTM.esc(it.title)} ${fcfs}</div>
      <div class="text-sm text-gray-400 mt-0.5">${meta}</div>
      <div class="text-[11px] font-mono text-gray-600 mt-1">${HQRTM.esc(it.source)}</div></div>
      <span class="text-accent text-sm">Öppna →</span></a>`;
  }

  const seen = new Set();
  let total = 0;

  function setCount() { document.getElementById("count").textContent = total + " st"; }

  function prepend(it) {
    const key = (it.source || "") + ":" + (it.external_id || it.id || "");
    if (seen.has(key)) return;          // дедуп на клиенте (FE-RT-003)
    seen.add(key);
    empty.classList.add("hidden");
    feed.insertAdjacentHTML("afterbegin", card(it));
    feed.firstElementChild.animate(
      [{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }],
      { duration: 350, easing: "ease-out" }
    );
    total += 1; setCount();
  }

  async function load() {
    const matched = document.getElementById("only-matched").checked ? "?matched=true" : "";
    const { ok, data } = await HQRTM.api("/api/listings" + matched);
    if (!ok) return HQRTM.toast("Kunde inte ladda flödet", "error");
    seen.clear();
    data.items.forEach((it) => seen.add((it.source || "") + ":" + (it.external_id || it.id || "")));
    feed.innerHTML = data.items.map(card).join("");
    empty.classList.toggle("hidden", data.items.length > 0);
    total = data.total; setCount();
  }

  /* --- real-time через SSE (Фаза 6) с авто-reconnect + fallback на polling --- */
  function setLive(state) {
    const dot = document.getElementById("live-dot");
    const label = document.getElementById("live-label");
    const map = { live: ["#15b878", "live"], reconnecting: ["#e8a13a", "återansluter…"], off: ["#9aa6a1", "polling"] };
    const [color, text] = map[state] || map.off;
    dot.style.background = color; label.textContent = text;
  }

  let es = null, pollTimer = null, failures = 0;

  function startPolling() {
    if (pollTimer) return;
    setLive("off");
    pollTimer = setInterval(load, 20000);    // fallback (FE-RT-004)
  }
  function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

  function startSSE() {
    if (!window.EventSource) return startPolling();
    const token = localStorage.getItem("hqrtm_access");
    if (!token) return;
    es = new EventSource(`/sse/feed?token=${encodeURIComponent(token)}`);
    es.onopen = () => { failures = 0; stopPolling(); setLive("live"); };
    es.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.listing) prepend(msg.listing);
      } catch (_) {}
    };
    es.onerror = () => {
      setLive("reconnecting");
      // EventSource переподключается сам; после нескольких неудач — fallback на polling
      if (++failures >= 3) startPolling();
    };
  }

  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("only-matched").addEventListener("change", load);
  window.addEventListener("beforeunload", () => { if (es) es.close(); });

  load();
  startSSE();
</script>
{% endblock %}
