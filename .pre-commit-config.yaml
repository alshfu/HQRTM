# Pre-commit-hookar. Installation: pre-commit install
# Skyddar public repo: format/lint + detect-secrets (mot läckage av tokens).
# HQRTM-Demo/ — statiska prototyper, rör vi inte (inte vårt format).
exclude: '^HQRTM-Demo/'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Genererad minifierad CSS (Tailwind-bygge) rör vi inte.
        exclude: '^web/static/css/app\.css$'
      - id: end-of-file-fixer
        exclude: '^web/static/css/app\.css$'
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: detect-private-key
