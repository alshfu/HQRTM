# Pre-commit хуки. Установка: pre-commit install
# Защищают public repo: формат/линт + detect-secrets (анти-утечка токенов).
# HQRTM-Demo/ — статические прототипы, не трогаем (формат не наш).
exclude: '^HQRTM-Demo/'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Генерируемый минифицированный CSS (Tailwind-сборка) не трогаем.
        exclude: '^web/static/css/app\.css$'
      - id: end-of-file-fixer
        exclude: '^web/static/css/app\.css$'
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: detect-private-key
