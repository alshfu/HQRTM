<!DOCTYPE html>
<html lang="sv" data-theme="light" data-view="comfort" data-density="cozy" data-card="card" data-feed="urgency" data-frame="tablet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HQRTM — tablet</title>
<script>window.__HQRTM_FRAME="tablet";</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   HomeQ Real-Time Monitor — design tokens, theming, reset, shell
   Two personalities (Comfort / Terminal) × (light / dark) × density × accent.
   ========================================================================== */

/* ---- Fonts loaded in index.html (Schibsted Grotesk + JetBrains Mono) ------ */

:root {
  /* accent is overwritten at runtime from the Tweaks accent picker */
  --accent: #15b878;
  --accent-ink: #ffffff;               /* text/icon sitting ON accent */
  --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
  --accent-line: color-mix(in oklab, var(--accent) 38%, transparent);
  --accent-dim: color-mix(in oklab, var(--accent) 60%, var(--text));
  --amber: #e8a13a;                     /* "closing soon" */
  --amber-soft: color-mix(in oklab, var(--amber) 16%, transparent);
  --red: #e2563f;
  --red-soft: color-mix(in oklab, var(--red) 15%, transparent);

  /* radii / motion — overridden per view mode */
  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 8px;
  --r-pill: 999px;
  --ease: cubic-bezier(.32,.72,.34,1);

  /* density — overridden per [data-density] */
  --feed-gap: 10px;
  --card-pad: 16px;
  --row-h: 44px;

  --shell-pad: 22px;
  --content-max: 1180px;

  /* fonts */
  --font-ui: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --num-font: var(--font-ui);
  --num-feat: "tnum" 1, "lnum" 1;
}

/* -------- Light theme -------- */
[data-theme="light"] {
  --bg:        oklch(0.985 0.004 140);
  --bg-2:      oklch(0.962 0.005 140);
  --surface:   oklch(1 0 0);
  --surface-2: oklch(0.975 0.004 140);
  --surface-3: oklch(0.955 0.005 140);
  --text:      oklch(0.24 0.013 155);
  --text-2:    oklch(0.46 0.012 155);
  --text-3:    oklch(0.60 0.010 155);
  --border:    oklch(0.905 0.006 150);
  --border-2:  oklch(0.935 0.005 150);
  --line:      oklch(0.92 0.005 150);
  --shadow-1: 0 1px 2px rgba(20,30,25,.05), 0 1px 1px rgba(20,30,25,.04);
  --shadow-2: 0 4px 14px rgba(20,32,26,.07), 0 1px 3px rgba(20,32,26,.05);
  --shadow-3: 0 18px 50px rgba(18,30,24,.13), 0 4px 12px rgba(18,30,24,.08);
  --glass: rgba(255,255,255,.72);
  --accent-ink: #ffffff;
  color-scheme: light;
}

/* -------- Dark theme -------- */
[data-theme="dark"] {
  --bg:        oklch(0.165 0.013 165);
  --bg-2:      oklch(0.195 0.014 165);
  --surface:   oklch(0.215 0.015 165);
  --surface-2: oklch(0.245 0.016 165);
  --surface-3: oklch(0.275 0.018 165);
  --text:      oklch(0.965 0.008 150);
  --text-2:    oklch(0.74 0.013 150);
  --text-3:    oklch(0.60 0.013 150);
  --border:    oklch(0.30 0.018 165);
  --border-2:  oklch(0.275 0.016 165);
  --line:      oklch(0.275 0.016 165);
  --shadow-1: 0 1px 2px rgba(0,0,0,.3);
  --shadow-2: 0 6px 18px rgba(0,0,0,.36), 0 1px 3px rgba(0,0,0,.3);
  --shadow-3: 0 22px 60px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.4);
  --glass: rgba(28,34,31,.72);
  --accent-ink: #06140d;
  color-scheme: dark;
}

/* -------- View mode: Comfort (default) -------- */
[data-view="comfort"] {
  --r-lg: 18px; --r-md: 13px; --r-sm: 9px;
  --num-font: var(--font-ui);
}
/* -------- View mode: Terminal -------- */
[data-view="terminal"] {
  --r-lg: 7px; --r-md: 6px; --r-sm: 5px;
  --num-font: var(--font-mono);
  --feed-gap: 1px;
  --card-pad: 12px;
}

/* -------- Density -------- */
[data-density="compact"]  { --feed-gap: 5px;  --card-pad: 12px; --row-h: 38px; }
[data-density="cozy"]     { --feed-gap: 10px; --card-pad: 16px; --row-h: 44px; }
[data-density="spacious"] { --feed-gap: 16px; --card-pad: 22px; --row-h: 52px; }
[data-view="terminal"][data-density="compact"]  { --feed-gap: 1px; }
[data-view="terminal"][data-density="cozy"]      { --feed-gap: 2px; }
[data-view="terminal"][data-density="spacious"]  { --feed-gap: 4px; }

/* ============================ reset ====================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-size: 15px;
  line-height: 1.5;
  transition: background .4s var(--ease), color .25s var(--ease);
}
#root { height: 100%; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }
h1,h2,h3,h4,p { margin: 0; }
::selection { background: var(--accent-soft); }

.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
.num  { font-family: var(--num-font); font-feature-settings: var(--num-feat); font-variant-numeric: tabular-nums; }

/* scrollbars */
*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--text) 18%, transparent);
  border-radius: 999px; border: 3px solid transparent; background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: color-mix(in oklab, var(--text) 30%, transparent); background-clip: content-box; }

/* ============================ app shell ================================= */
.app {
  display: grid;
  grid-template-columns: 248px 1fr;
  height: 100%;
  background: var(--bg);
}
[data-view="terminal"] .app { grid-template-columns: 224px 1fr; }

/* ---- Sidebar ---- */
.side {
  display: flex; flex-direction: column;
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  padding: 16px 14px;
  gap: 6px;
  min-height: 0;
}
.side-brand {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 8px 14px;
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--accent);
  display: grid; place-items: center;
  color: var(--accent-ink);
  position: relative; flex-shrink: 0;
  box-shadow: 0 2px 8px var(--accent-soft);
}
[data-view="terminal"] .brand-mark { border-radius: 5px; }
.brand-mark .pulse-dot {
  position: absolute; top: -3px; right: -3px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg-2);
}
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-name small { display: block; font-weight: 500; font-size: 10.5px; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; }

.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; border-radius: var(--r-sm);
  color: var(--text-2); font-weight: 500; font-size: 14px;
  border: 1px solid transparent;
  transition: background .14s, color .14s;
  position: relative; user-select: none; cursor: pointer;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-1); }
.nav-item.active svg { color: var(--accent); opacity: 1; }
.nav-item .count {
  margin-left: auto; font-size: 11px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent-dim);
  padding: 1px 7px; border-radius: 999px; font-family: var(--num-font); font-variant-numeric: tabular-nums;
}
.side-spacer { flex: 1; }

.side-foot { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; }
.userchip {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--r-sm);
  transition: background .14s;
}
.userchip:hover { background: var(--surface-2); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent) 50%, #6a8cff));
  display: grid; place-items: center; color: var(--accent-ink); font-weight: 700; font-size: 12px;
}
[data-view="terminal"] .avatar { border-radius: 6px; }
.userchip-meta { min-width: 0; }
.userchip-meta b { font-size: 13px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.userchip-meta span { font-size: 11.5px; color: var(--text-3); }

/* ---- Main column ---- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 var(--shell-pad);
  height: 60px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklab, var(--bg) 80%, transparent);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 30;
}
.topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
.topbar-sub { font-size: 12.5px; color: var(--text-3); margin-top: 1px; white-space: nowrap; }
.topbar > .only-desktop:first-child { flex-shrink: 0; }
.topbar-spacer { flex: 1; }

.content { flex: 1; overflow-y: auto; min-height: 0; }
.page { max-width: var(--content-max); margin: 0 auto; padding: 26px var(--shell-pad) 80px; }
.page-wide { max-width: 100%; }

/* connection status pill */
.wsdot {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 600; color: var(--text-2);
  padding: 5px 11px 5px 9px; border-radius: var(--r-pill);
  border: 1px solid var(--border); background: var(--surface);
}
.wsdot i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); position: relative; }
.wsdot.live i { box-shadow: 0 0 0 0 var(--accent-line); animation: ping 1.8s var(--ease) infinite; }
.wsdot.reconnecting i { background: var(--amber); animation: blink 1s steps(2) infinite; }
.wsdot.off i { background: var(--text-3); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--accent-line); } 70%,100% { box-shadow: 0 0 0 7px transparent; } }
@keyframes blink { 50% { opacity: .25; } }

/* icon buttons in topbar */
.iconbtn {
  width: 36px; height: 36px; border-radius: var(--r-sm);
  display: grid; place-items: center;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  transition: background .14s, color .14s, border-color .14s;
}
.iconbtn:hover { background: var(--surface-2); color: var(--text); }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }

.segmented {
  display: inline-flex; padding: 3px; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
}
.segmented button {
  border: 0; background: transparent; color: var(--text-2);
  font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: calc(var(--r-sm) - 3px);
  display: flex; align-items: center; gap: 6px; transition: .14s;
}
.segmented button svg { width: 15px; height: 15px; }
.segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
[data-theme="dark"] .segmented button.active { background: var(--surface-3); }

/* ===== mobile bottom tab bar (hidden on desktop) ===== */
.tabbar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  [data-view="terminal"] .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { height: 100%; }
  .topbar { height: 56px; padding: 0 14px; }
  .page { padding: 18px 14px 96px; }
  .content { padding-bottom: env(safe-area-inset-bottom); }
  .tabbar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: color-mix(in oklab, var(--bg-2) 92%, transparent);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: transparent; border: 0; color: var(--text-3);
    font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: var(--r-sm);
    position: relative; flex: 1; max-width: 80px;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--accent); }
  .tab .tab-count {
    position: absolute; top: 0; right: 18px; min-width: 16px; height: 16px;
    background: var(--accent); color: var(--accent-ink); border-radius: 999px;
    font-size: 9.5px; display: grid; place-items: center; padding: 0 4px;
    border: 2px solid var(--bg-2);
  }
}

/* hide-on-mobile / show-on-mobile helpers */
.only-mobile { display: none; }
@media (max-width: 860px) {
  .only-desktop { display: none !important; }
  .only-mobile { display: revert; }
}

/* phone-preview mode: constrain the whole app to a phone frame on desktop */
[data-frame="phone"] .app { grid-template-columns: 1fr; }
[data-frame="phone"] .side { display: none; }
[data-frame="phone"] .tabbar { display: flex; }
[data-frame="phone"] .only-desktop { display: none !important; }
[data-frame="phone"] .only-mobile { display: revert; }

/* ============================================================================
   HomeQ Real-Time Monitor — components & screen styles
   ========================================================================== */

/* ============================ buttons =================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: 14px; line-height: 1;
  padding: 0 16px; height: 40px; border-radius: var(--r-sm);
  border: 1px solid transparent; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .08s, box-shadow .15s, color .15s;
  user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 17px; height: 17px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 2px var(--accent-soft); }
.btn-primary:hover { background: color-mix(in oklab, var(--accent) 88%, #000); box-shadow: 0 4px 14px var(--accent-soft); }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-1); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-quiet { background: transparent; color: var(--text-2); }
.btn-quiet:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--red-soft); color: var(--red); border-color: color-mix(in oklab, var(--red) 30%, transparent); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: calc(var(--r-sm) - 1px); }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; pointer-events: none; }

/* ============================ fields ==================================== */
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; justify-content: space-between; align-items: baseline; }
.field > label .hint { font-weight: 500; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.input, .select {
  height: 42px; padding: 0 13px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 14.5px; width: 100%; transition: border-color .14s, box-shadow .14s, background .14s;
  outline: none;
}
textarea.input { height: auto; padding: 11px 13px; resize: vertical; line-height: 1.5; }
.input::placeholder { color: var(--text-3); }
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
.input.err { border-color: var(--red); box-shadow: 0 0 0 3.5px var(--red-soft); }
.field-err { font-size: 12px; color: var(--red); font-weight: 500; display: flex; align-items: center; gap: 5px; }
.input-group { position: relative; display: flex; align-items: center; }
.input-group .prefix, .input-group .suffix { position: absolute; color: var(--text-3); font-size: 13.5px; font-weight: 500; pointer-events: none; }
.input-group .prefix { left: 13px; } .input-group .prefix ~ .input { padding-left: 34px; }
.input-group .suffix { right: 13px; }
.select { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='none' stroke='%2390978f' stroke-width='1.6' stroke-linecap='round' d='M2 2l4 4 4-4'/></svg>"); background-repeat: no-repeat; background-position: right 13px center; padding-right: 36px; }

.checkbox { display: flex; align-items: flex-start; gap: 11px; cursor: pointer; font-size: 13.5px; color: var(--text-2); line-height: 1.45; }
.checkbox input { position: absolute; opacity: 0; }
.checkbox .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border); flex-shrink: 0; display: grid; place-items: center; transition: .14s; margin-top: 1px; background: var(--surface); }
.checkbox .box svg { width: 13px; height: 13px; color: var(--accent-ink); opacity: 0; transform: scale(.5); transition: .14s; }
.checkbox input:checked + .box { background: var(--accent); border-color: var(--accent); }
.checkbox input:checked + .box svg { opacity: 1; transform: scale(1); }
.checkbox input:focus-visible + .box { box-shadow: 0 0 0 3.5px var(--accent-soft); }
.checkbox a { color: var(--accent-dim); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* switch */
.switch { position: relative; width: 42px; height: 24px; border-radius: 999px; background: var(--border); border: 0; transition: background .18s; flex-shrink: 0; padding: 0; }
.switch i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .18s var(--ease); }
.switch[data-on="1"] { background: var(--accent); }
.switch[data-on="1"] i { transform: translateX(18px); }

/* segmented control inline (chips) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface);
  font-size: 13.5px; font-weight: 600; color: var(--text-2); transition: .14s; user-select: none;
}
.chip svg { width: 15px; height: 15px; }
.chip:hover { background: var(--surface-2); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-dim); }
[data-view="terminal"] .chip { border-radius: var(--r-sm); }

/* ============================ badges ==================================== */
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
  border-radius: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .01em;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border-2);
}
.badge svg { width: 12px; height: 12px; }
.badge-fcfs { background: var(--accent-soft); color: var(--accent-dim); border-color: var(--accent-line); }
.badge-amber { background: var(--amber-soft); color: color-mix(in oklab, var(--amber) 75%, var(--text)); border-color: color-mix(in oklab, var(--amber) 35%, transparent); }
.badge-red { background: var(--red-soft); color: var(--red); border-color: color-mix(in oklab, var(--red) 30%, transparent); }
.badge-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ============================ cards / panels ============================ */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-1); }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.panel-head h3 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.panel-body { padding: 18px; }

.section-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 15px 16px; box-shadow: var(--shadow-1); position: relative; overflow: hidden; }
.stat .k { font-size: 12px; color: var(--text-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.stat .k svg { width: 14px; height: 14px; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; font-family: var(--num-font); font-variant-numeric: tabular-nums; line-height: 1; }
.stat .v small { font-size: 14px; color: var(--text-3); font-weight: 600; }
.stat .d { font-size: 11.5px; margin-top: 6px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.stat .d.up { color: var(--accent-dim); } .stat .d.down { color: var(--red); }
.stat .spark { position: absolute; right: 12px; bottom: 10px; opacity: .5; }
@media (max-width: 860px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* ============================ feed ===================================== */
.feed-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.feed-toolbar .grow { flex: 1; }
.searchbar { position: relative; flex: 1; min-width: 180px; max-width: 360px; }
.searchbar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-3); }
.searchbar .input { height: 38px; padding-left: 36px; }

.feed { display: flex; flex-direction: column; gap: var(--feed-gap); }

/* --- listing as CARD --- */
.lc {
  display: grid; grid-template-columns: 116px 1fr auto; gap: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: var(--card-pad); box-shadow: var(--shadow-1);
  transition: box-shadow .18s, border-color .18s, transform .18s;
  position: relative; overflow: hidden;
}
.lc:hover { box-shadow: var(--shadow-2); border-color: var(--border-2); }
.lc-photo { width: 116px; height: 92px; border-radius: var(--r-sm); overflow: hidden; flex-shrink: 0; position: relative; }
.lc-main { min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.lc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lc-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-area { font-size: 13px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.lc-area svg { width: 14px; height: 14px; }
.lc-specs { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 2px; }
.lc-spec { display: flex; flex-direction: column; gap: 1px; }
.lc-spec .sl { font-size: 10.5px; color: var(--text-3); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.lc-spec .sv { font-size: 14.5px; font-weight: 700; font-family: var(--num-font); font-variant-numeric: tabular-nums; }
.lc-spec .sv small { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.lc-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 10px; }
.lc-rent { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; font-family: var(--num-font); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lc-rent small { font-size: 12px; font-weight: 600; color: var(--text-3); }
.lc-age { font-size: 12px; font-weight: 700; color: var(--text-3); font-family: var(--font-mono); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.lc-age .livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.lc-cta { display: flex; gap: 8px; }

/* --- listing as ROW (comfort dense) --- */
[data-card="row"] .lc { grid-template-columns: 1fr auto; padding: 12px 16px; align-items: center; }
[data-card="row"] .lc-photo { display: none; }
[data-card="row"] .lc-specs { gap: 14px; }

/* --- listing as TICKER (terminal) --- */
[data-card="ticker"] .feed, [data-view="terminal"] .feed { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
[data-card="ticker"] .lc, [data-view="terminal"] .lc {
  grid-template-columns: minmax(0,2.2fr) 0.8fr 0.8fr 0.7fr 1fr 0.9fr auto;
  align-items: center; gap: 14px; border: 0; border-bottom: 1px solid var(--line);
  border-radius: 0; box-shadow: none; padding: 9px 14px; font-family: var(--font-mono);
}
[data-card="ticker"] .lc:hover, [data-view="terminal"] .lc:hover { background: var(--surface-2); transform: none; }
[data-card="ticker"] .lc-photo, [data-view="terminal"] .lc-photo { display: none; }
[data-card="ticker"] .lc-main, [data-view="terminal"] .lc-main { display: contents; }
[data-card="ticker"] .lc-area, [data-view="terminal"] .lc-area { display: none; }
[data-card="ticker"] .lc-specs, [data-view="terminal"] .lc-specs { display: contents; }
[data-card="ticker"] .lc-spec .sl, [data-view="terminal"] .lc-spec .sl { display: none; }
[data-card="ticker"] .lc-spec, [data-view="terminal"] .lc-spec { flex-direction: row; align-items: baseline; gap: 3px; font-size: 13px; justify-content: flex-end; }
[data-card="ticker"] .lc-side, [data-view="terminal"] .lc-side { display: contents; }
[data-card="ticker"] .lc-rent, [data-view="terminal"] .lc-rent { justify-self: end; }
[data-card="ticker"] .lc-age, [data-view="terminal"] .lc-age { justify-self: end; }
[data-card="ticker"] .lc-cta, [data-view="terminal"] .lc-cta { justify-self: end; }
[data-card="ticker"] .lc-top, [data-view="terminal"] .lc-top { flex-wrap: nowrap; min-width: 0; }
[data-card="ticker"] .lc-title, [data-view="terminal"] .lc-title { font-size: 13.5px; font-weight: 600; }
[data-card="ticker"] .lc-rent, [data-view="terminal"] .lc-rent { font-size: 14px; font-weight: 700; }
[data-card="ticker"] .lc-rent small, [data-view="terminal"] .lc-rent small { display: none; }
[data-card="ticker"] .ticker-only, [data-view="terminal"] .ticker-only { display: inline; }
.ticker-only { display: none; }

/* fresh-match highlight */
.lc.fresh { animation: flyin .5s var(--ease) both; }
.lc.fresh::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1.5px var(--accent); 
}
.lc.fresh.glow::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
}
[data-feed="urgency"] .lc.fresh { animation: flyin-urgent .55s var(--ease) both; }
[data-feed="urgency"] .lc.fresh::before { animation: freshpulse 1.6s var(--ease) 2; }
[data-feed="calm"] .lc.fresh { animation: fadein .7s var(--ease) both; }
@keyframes flyin { from { opacity: 0; transform: translateY(-12px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes flyin-urgent { 0% { opacity: 0; transform: translateY(-18px) scale(.97); } 60% { transform: translateY(2px) scale(1.004); } 100% { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes freshpulse { 0%,100% { box-shadow: inset 0 0 0 1.5px var(--accent); } 50% { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px var(--accent-soft); } }

.new-banner {
  position: sticky; top: 0; z-index: 5; align-self: center;
  display: inline-flex; align-items: center; gap: 8px; margin: 0 auto 4px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px;
  padding: 7px 14px; border-radius: var(--r-pill); box-shadow: var(--shadow-2); cursor: pointer;
  animation: dropin .3s var(--ease) both;
}
@keyframes dropin { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* placeholder image */
.ph {
  width: 100%; height: 100%;
  background-image: repeating-linear-gradient(135deg, var(--surface-2) 0 7px, var(--surface-3) 7px 14px);
  display: grid; place-items: center; color: var(--text-3);
}
.ph span { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .04em; opacity: .8; background: var(--surface); padding: 2px 6px; border-radius: 4px; }

/* ============================ empty / loading / error ================== */
.state { text-align: center; padding: 64px 24px; max-width: 420px; margin: 0 auto; }
.state .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; margin: 0 auto 16px; color: var(--text-3); }
.state .ico svg { width: 26px; height: 26px; }
.state h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.state p { color: var(--text-3); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }

.skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--r-sm); }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.skel-card { display: grid; grid-template-columns: 116px 1fr auto; gap: 16px; padding: var(--card-pad); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }

/* ============================ tables (history) ========================= */
.table-wrap { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); box-shadow: var(--shadow-1); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .12s; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .t-addr { font-weight: 600; }
.tbl .t-time { color: var(--text-3); font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.tbl .t-lat { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; }
.pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface-2); font-size: 13px; color: var(--text-3); }
.pager .pnav { display: flex; gap: 6px; }

@media (max-width: 720px) {
  .table-wrap { border: 0; background: transparent; box-shadow: none; }
  .tbl, .tbl thead, .tbl tbody, .tbl th, .tbl td, .tbl tr { display: block; }
  .tbl thead { display: none; }
  .tbl tr { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 10px; padding: 6px 4px; box-shadow: var(--shadow-1); }
  .tbl td { border: 0; padding: 7px 14px; display: flex; justify-content: space-between; gap: 12px; }
  .tbl td::before { content: attr(data-l); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); }
  .pager { border: 0; border-radius: var(--r-md); border: 1px solid var(--border); margin-top: 4px; }
}

/* ============================ modal ==================================== */
.scrim { position: fixed; inset: 0; background: color-mix(in oklab, #0a120e 55%, transparent); backdrop-filter: blur(3px); z-index: 100; display: grid; place-items: center; padding: 20px; animation: fadein .2s ease; }
.modal { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-3); max-height: calc(100vh - 40px); display: flex; flex-direction: column; animation: modalin .25s var(--ease) both; overflow: hidden; }
@keyframes modalin { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.modal-head .sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface-2); }
.modal-foot .grow { flex: 1; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

/* range pair */
.range-pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; }
.range-pair .sep { padding-bottom: 11px; color: var(--text-3); }

/* ============================ filters list ============================= */
.filter-card { display: flex; align-items: center; gap: 16px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-1); transition: box-shadow .16s, border-color .16s; }
.filter-card:hover { box-shadow: var(--shadow-2); }
.filter-card.off { opacity: .6; }
.filter-ico { width: 42px; height: 42px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent-dim); display: grid; place-items: center; flex-shrink: 0; }
.filter-ico svg { width: 20px; height: 20px; }
.filter-meta { flex: 1; min-width: 0; }
.filter-meta h4 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.filter-crit { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
.crit { font-size: 12px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border-2); padding: 3px 9px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.crit svg { width: 12px; height: 12px; color: var(--text-3); }
.filter-stat { text-align: right; flex-shrink: 0; }
.filter-stat .n { font-size: 20px; font-weight: 800; font-family: var(--num-font); font-variant-numeric: tabular-nums; color: var(--accent-dim); }
.filter-stat .l { font-size: 11px; color: var(--text-3); font-weight: 600; }
.filter-actions { display: flex; align-items: center; gap: 8px; }
@media (max-width: 720px) {
  .filter-card { flex-wrap: wrap; }
  .filter-stat { order: 3; }
  .filter-actions { margin-left: auto; }
}

/* ============================ settings ================================= */
.settings-grid { display: grid; grid-template-columns: 200px 1fr; gap: 32px; align-items: start; }
.settings-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 80px; }
.settings-nav button { text-align: left; padding: 9px 12px; border-radius: var(--r-sm); background: transparent; border: 0; color: var(--text-2); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: .14s; }
.settings-nav button svg { width: 17px; height: 17px; }
.settings-nav button:hover { background: var(--surface-2); color: var(--text); }
.settings-nav button.active { background: var(--accent-soft); color: var(--accent-dim); }
.setting-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .sr-meta { flex: 1; }
.setting-row .sr-meta b { font-size: 14.5px; font-weight: 600; display: block; }
.setting-row .sr-meta span { font-size: 13px; color: var(--text-3); }
.danger-zone { border: 1px solid color-mix(in oklab, var(--red) 30%, var(--border)); border-radius: var(--r-md); padding: 4px 18px; background: color-mix(in oklab, var(--red) 5%, var(--surface)); }
@media (max-width: 720px) { .settings-grid { grid-template-columns: 1fr; gap: 18px; } .settings-nav { flex-direction: row; overflow-x: auto; position: static; padding-bottom: 4px; } }

/* telegram link panel */
.tg-panel { display: grid; grid-template-columns: 1fr 280px; gap: 0; overflow: hidden; }
@media (max-width: 720px) { .tg-panel { grid-template-columns: 1fr; } }
.tg-side { background: linear-gradient(160deg, color-mix(in oklab, var(--accent) 14%, var(--surface)), var(--surface)); border-left: 1px solid var(--border); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.tg-status { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: var(--r-pill); white-space: nowrap; }
.tg-status.linked { background: var(--accent-soft); color: var(--accent-dim); }
.tg-status.unlinked { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.code-box { font-family: var(--font-mono); font-size: 24px; font-weight: 700; letter-spacing: .26em; text-align: center; padding: 16px; background: var(--bg-2); border: 1px dashed var(--accent-line); border-radius: var(--r-sm); color: var(--accent-dim); }

/* ============================ onboarding =============================== */
.ob { min-height: 100%; display: grid; place-items: center; padding: 32px 20px; }
.ob-card { width: 100%; max-width: 560px; }
.steps { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; justify-content: center; }
.step-dot { display: flex; align-items: center; gap: 8px; }
.step-dot i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); font-family: var(--num-font); }
.step-dot.done i { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step-dot.active i { background: var(--accent-soft); color: var(--accent-dim); border-color: var(--accent-line); }
.step-dot span { font-size: 12.5px; font-weight: 600; color: var(--text-3); }
.step-dot.active span, .step-dot.done span { color: var(--text); }
.step-line { width: 30px; height: 2px; background: var(--border); border-radius: 2px; }
.step-line.done { background: var(--accent); }

/* ============================ auth / landing =========================== */
.auth { min-height: 100%; display: grid; grid-template-columns: 1.05fr 1fr; }
@media (max-width: 900px) { .auth { grid-template-columns: 1fr; } .auth-aside { display: none; } }
.auth-form-wrap { display: grid; place-items: center; padding: 40px 24px; }
.auth-form { width: 100%; max-width: 384px; display: flex; flex-direction: column; gap: 18px; }
.auth-aside { background: var(--bg-2); border-left: 1px solid var(--border); position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 40px; }
.auth-divider { display: flex; align-items: center; gap: 14px; color: var(--text-3); font-size: 12px; font-weight: 600; }
.auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

/* mini live-feed preview used in auth aside + landing */
.preview-feed { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.pf-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 11px 13px; box-shadow: var(--shadow-1); }
.pf-row .pf-ph { width: 38px; height: 38px; border-radius: 7px; flex-shrink: 0; }
.pf-row .pf-meta { flex: 1; min-width: 0; }
.pf-row .pf-meta b { font-size: 13px; font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-row .pf-meta span { font-size: 11.5px; color: var(--text-3); }
.pf-row .pf-rent { font-weight: 800; font-size: 14px; font-family: var(--num-font); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* landing */
.lp { min-height: 100%; }
.lp-nav { display: flex; align-items: center; gap: 14px; padding: 18px 28px; max-width: 1200px; margin: 0 auto; }
.lp-hero { max-width: 1080px; margin: 0 auto; padding: 40px 28px 60px; text-align: center; }
.lp-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--accent-dim); background: var(--accent-soft); border: 1px solid var(--accent-line); padding: 6px 14px; border-radius: 999px; margin-bottom: 22px; white-space: nowrap; }
.lp-h1 { font-size: clamp(34px, 6vw, 62px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; margin-bottom: 18px; }
.lp-h1 em { font-style: normal; color: var(--accent); }
.lp-sub { font-size: clamp(16px, 2.2vw, 20px); color: var(--text-2); max-width: 600px; margin: 0 auto 30px; line-height: 1.55; }
.lp-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.lp-demo { max-width: 920px; margin: 36px auto 0; }
.lp-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 1080px; margin: 0 auto; padding: 20px 28px 70px; }
@media (max-width: 800px) { .lp-features { grid-template-columns: 1fr; } }
.lp-feat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 22px; box-shadow: var(--shadow-1); }
.lp-feat .fi { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); color: var(--accent-dim); display: grid; place-items: center; margin-bottom: 14px; }
.lp-feat h3 { font-size: 16px; font-weight: 700; margin-bottom: 7px; }
.lp-feat p { font-size: 13.5px; color: var(--text-3); line-height: 1.55; }

/* misc utility */
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; }
.gap6 { gap: 6px; } .gap10 { gap: 10px; } .gap14 { gap: 14px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.mb0 { margin-bottom: 0; }
.muted { color: var(--text-3); }
.center { text-align: center; }
.divider { height: 1px; background: var(--border); margin: 4px 0; }
.link { color: var(--accent-dim); font-weight: 600; cursor: pointer; }
.link:hover { text-decoration: underline; }
.page-head { margin-bottom: 22px; }
.page-head h2 { font-size: 23px; font-weight: 800; letter-spacing: -0.025em; }
.page-head p { color: var(--text-3); font-size: 14px; margin-top: 4px; }
.toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────

// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.

    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),

    panel.style.bottom = offsetRef.current.y + 'px';

    if (!open) return;
    clampToViewport();

      window.addEventListener('resize', clampToViewport);

    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateListing(opts = {}) {
  const loc = pick(AREAS);
  const rooms = opts.rooms ?? pick([1, 1, 2, 2, 2, 3, 3, 4]);
  const sqm = opts.sqm ?? rooms * rnd(18, 26) + rnd(-4, 8);
  const rent = opts.rent ?? Math.round((4200 + sqm * rnd(95, 165)) / 50) * 50;
  const fcfs = opts.fcfs ?? Math.random() < 0.58;
  const floor = rnd(0, 7);
  return {
    id: "L" + (++__seq),
    street: pick(STREETS),
    streetNo: rnd(1, 88),
    area: loc.area,
    city: loc.city,
    rooms, sqm, rent, fcfs, floor,
    host: pick(HOSTS),
    queueDays: fcfs ? 0 : rnd(120, 1900),
    available: pick(["Omgående", "1 jul", "1 aug", "15 aug", "1 sep"]),
    createdAt: opts.createdAt ?? Date.now(),
    filterId: opts.filterId ?? null,
  };
}

function seedListings(n) {
  const out = [];
  const now = Date.now();
  for (let i = 0; i < n; i++) {
    const l = generateListing({ createdAt: now - i * rnd(40, 320) * 1000 });
    out.push(l);
  }
  return out;
}

/* ---- sample notification history ---- */
const CHANNELS = ["telegram", "telegram", "telegram", "email"];
const NOTIF_STATUS = ["delivered", "delivered", "delivered", "delivered", "failed"];
function seedNotifications(n) {
  const out = [];
  let t = Date.now() - 60_000;
  for (let i = 0; i < n; i++) {
    t -= rnd(180, 5400) * 1000;
    const l = generateListing({ createdAt: t });
    out.push({
      id: "N" + (2000 + i),
      listing: l,
      channel: pick(CHANNELS),
      status: pick(NOTIF_STATUS),
      latencyMs: rnd(340, 2600),
      filterName: pick(SAMPLE_FILTERS).name,
      sentAt: t,
    });
  }
  return out;
}

/* ---- formatters ---- */
function fmtKr(n) { return n.toLocaleString("sv-SE").replace(/,/g, " "); }
function timeAgo(ms, lang) {
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  const L = STRINGS[lang];
  if (s < 60) return s + L.t_s;
  const m = Math.floor(s / 60);
  if (m < 60) return m + L.t_m;
  const h = Math.floor(m / 60);
  if (h < 24) return h + L.t_h;
  const d = Math.floor(h / 24);
  return d + L.t_d;
}
function fmtClock(ms) {
  const d = new Date(ms);
  return d.toLocaleString("sv-SE", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

<script type="text/babel">
/* ui.jsx — shared presentational components */

function Btn({ variant = "ghost", size, icon, iconRight, children, className = "", ...rest }) {
  const cls = `btn btn-${variant}${size ? " btn-" + size : ""}${className ? " " + className : ""}`;
  return (
    <button className={cls} {...rest}>
      {icon && <Icon name={icon} />}
      {children}
      {iconRight && <Icon name={iconRight} />}
    </button>
  );
}

function IconBtn({ name, on, label, ...rest }) {
  return (
    <button className={`iconbtn${on ? " on" : ""}`} aria-label={label} title={label} {...rest}>
      <Icon name={name} />
    </button>
  );
}

function Field({ label, hint, error, children }) {
  return (
    <div className="field">
      {label && <label>{label}{hint && <span className="hint">{hint}</span>}</label>}
      {children}
      {error && <div className="field-err"><Icon name="x" style={{ width: 13, height: 13 }} />{error}</div>}
    </div>
  );
}

function Switch({ on, onChange, label }) {
  return (
    <button className="switch" data-on={on ? "1" : "0"} role="switch" aria-checked={!!on}
            aria-label={label} onClick={() => onChange(!on)}><i /></button>
  );
}

function Checkbox({ checked, onChange, children }) {
  return (
    <label className="checkbox">
      <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} />
      <span className="box"><Icon name="check" strokeWidth="3" /></span>
      <span>{children}</span>
    </label>
  );
}

function Badge({ kind, icon, children }) {
  return <span className={`badge${kind ? " badge-" + kind : ""}`}>{icon && <Icon name={icon} />}{children}</span>;
}

function Photo({ label = "FOTO", className = "" }) {
  return <div className={`ph ${className}`}><span>{label}</span></div>;
}

/* tiny sparkline */
function Spark({ points = [4, 6, 5, 8, 7, 11, 9, 13], w = 60, h = 22, color = "var(--accent)" }) {
  const max = Math.max(...points), min = Math.min(...points);
  const dx = w / (points.length - 1);
  const d = points.map((p, i) => `${i === 0 ? "M" : "L"}${(i * dx).toFixed(1)} ${(h - ((p - min) / (max - min || 1)) * h).toFixed(1)}`).join(" ");
  return (
    <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`} fill="none">
      <path d={d} stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

/* Modal */
function Modal({ title, sub, icon, onClose, children, footer, max }) {
  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);
  return (
    <div className="scrim" onMouseDown={onClose}>
      <div className="modal" style={max ? { maxWidth: max } : null} onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-head">
          {icon && <div className="filter-ico" style={{ width: 38, height: 38 }}><Icon name={icon} /></div>}
          <div className="grow">
            <h2>{title}</h2>
            {sub && <div className="sub">{sub}</div>}
          </div>
          <IconBtn name="x" label="Close" onClick={onClose} />
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
}

  const closingSoon = fresh && l.fcfs;

    <div className={`lc${fresh ? " fresh" : ""}${glow ? " glow" : ""}`} role="article">

        <div className="lc-top">

        <div className="lc-specs">
          <div className="lc-spec"><span className="sl">{L.room}</span><span className="sv num">{l.rooms}<small> {L.room}</small></span></div>
          <div className="lc-spec"><span className="sl">{L.sqm}</span><span className="sv num">{l.sqm}<small> {L.sqm}</small></span></div>
          <div className="lc-spec"><span className="sl">{L.floor}</span><span className="sv num">{l.floor}<small> {L.floor}</small></span></div>
        </div>
      </div>
      <div className="lc-side">
        <div className="lc-rent num">{fmtKr(l.rent)}<small> {L.rent_mo}</small></div>
        <div className="lc-age">
          {fresh && <span className="livedot" />}{age}
        </div>
        <div className="lc-cta">
          <Btn variant="primary" size="sm" iconRight="external" onClick={() => onOpen && onOpen(l)}>
            <span className="only-desktop">{L.view_to}</span>
            <span className="only-mobile">HomeQ</span>

        </div>
      </div>
    </div>
  );
}

  return (

      <div className="ico"><Icon name={icon} /></div>
      <h3>{title}</h3>
      <p>{text}</p>
      {action}
    </div>
  );
}

<script type="text/babel">
/* screens-app.jsx — Filter form, Filters screen, Dashboard / live feed */

const CITIES = ["Stockholm", "Göteborg", "Malmö", "Uppsala"];
function defaultFilter() {
  return { id: null, name: "", city: "Stockholm", areas: [], rentMin: 5000, rentMax: 14000,
    roomsMin: 1, roomsMax: 3, sqmMin: 30, sqmMax: 90, fcfsOnly: true, active: true };
}
function estimateMatches(f) {
  const areaW = (f.areas.length || 3) * 2.4;
  const rentW = Math.max(0, (f.rentMax - f.rentMin)) / 1400;
  const roomW = (f.roomsMax - f.roomsMin + 1) * 1.3;
  const fcfsW = f.fcfsOnly ? 0.55 : 1;
  return Math.max(1, Math.round((areaW + rentW + roomW) * fcfsW));
}

/* the reusable filter form body (used in modal + onboarding) */
function FilterFormBody({ lang, value, onChange, embedded }) {
  const L = STRINGS[lang];
  const f = value;
  const set = (patch) => onChange({ ...f, ...patch });
  const areaOptions = AREAS.filter((a) => a.city === f.city).map((a) => a.area);
  const toggleArea = (a) => set({ areas: f.areas.includes(a) ? f.areas.filter((x) => x !== a) : [...f.areas, a] });
  const numFix = (k, v, partner, dir) => {
    const n = Number(v) || 0;
    const patch = { [k]: n };
    if (dir === "min" && n > f[partner]) patch[partner] = n;
    if (dir === "max" && n < f[partner]) patch[partner] = n;
    set(patch);
  };
  const est = estimateMatches(f);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {!embedded && (
        <Field label={L.filter_name}>
          <input className="input" placeholder={lang === "sv" ? "t.ex. Söder · 2:a" : "e.g. Söder · 2 rooms"}
                 value={f.name} onChange={(e) => set({ name: e.target.value })} />
        </Field>
      )}
      <div className="form-grid">
        <Field label={L.f_city}>
          <select className="select" value={f.city} onChange={(e) => set({ city: e.target.value, areas: [] })}>
            {CITIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </Field>
        <Field label={L.f_rooms}>
          <div className="range-pair">
            <select className="select" value={f.roomsMin} onChange={(e) => numFix("roomsMin", e.target.value, "roomsMax", "min")}>
              {[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}
            </select>
            <span className="sep">–</span>
            <select className="select" value={f.roomsMax} onChange={(e) => numFix("roomsMax", e.target.value, "roomsMin", "max")}>
              {[1, 2, 3, 4, 5, 6].map((n) => <option key={n} value={n}>{n}+</option>)}
            </select>
          </div>
        </Field>
      </div>

      <Field label={L.f_areas} hint={`${f.areas.length || L.all}`}>
        <div className="chips">
          {areaOptions.map((a) => (
            <button type="button" key={a} className={`chip${f.areas.includes(a) ? " on" : ""}`} onClick={() => toggleArea(a)}>
              {f.areas.includes(a) && <Icon name="check" strokeWidth="2.6" />}{a}
            </button>
          ))}
        </div>
      </Field>

      <div className="form-grid">
        <Field label={L.f_rent}>
          <div className="range-pair">
            <div className="input-group">
              <input className="input" type="number" step="500" value={f.rentMin} onChange={(e) => numFix("rentMin", e.target.value, "rentMax", "min")} />
            </div>
            <span className="sep">–</span>
            <div className="input-group">
              <input className="input" type="number" step="500" value={f.rentMax} onChange={(e) => numFix("rentMax", e.target.value, "rentMin", "max")} />
            </div>
          </div>
        </Field>
        <Field label={L.f_sqm}>
          <div className="range-pair">
            <input className="input" type="number" step="5" value={f.sqmMin} onChange={(e) => numFix("sqmMin", e.target.value, "sqmMax", "min")} />
            <span className="sep">–</span>
            <input className="input" type="number" step="5" value={f.sqmMax} onChange={(e) => numFix("sqmMax", e.target.value, "sqmMin", "max")} />
          </div>
        </Field>
      </div>

      <div className="setting-row" style={{ borderBottom: 0, padding: "4px 0" }}>
        <div className="filter-ico" style={{ width: 38, height: 38 }}><Icon name="zap" /></div>
        <div className="sr-meta">
          <b>{L.f_fcfs_only}</b>
          <span>{L.f_fcfs_hint}</span>
        </div>
        <Switch on={f.fcfsOnly} onChange={(v) => set({ fcfsOnly: v })} label={L.f_fcfs_only} />
      </div>

      <div className="row gap10" style={{ background: "var(--accent-soft)", border: "1px solid var(--accent-line)", borderRadius: "var(--r-sm)", padding: "11px 14px" }}>
        <Icon name="eye" style={{ width: 18, height: 18, color: "var(--accent-dim)" }} />
        <div style={{ fontSize: 13.5 }}>
          <b className="num" style={{ color: "var(--accent-dim)", fontSize: 16 }}>≈ {est}</b>{" "}
          <span style={{ color: "var(--text-2)" }}>{L.would_match}</span>{" · "}
          <span className="muted num">{Math.round(est * 1.6)} {L.per_week}</span>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- Filters */
function FiltersScreen({ lang, filters, onSave, onDelete, onToggle }) {
  const L = STRINGS[lang];
  const [editing, setEditing] = React.useState(null); // filter object or null
  const [draft, setDraft] = React.useState(null);
  const [confirmDel, setConfirmDel] = React.useState(null);

  const openNew = () => { const d = defaultFilter(); setDraft(d); setEditing("new"); };
  const openEdit = (f) => { setDraft({ ...f }); setEditing(f.id); };
  const save = () => {
    const d = { ...draft };
    if (!d.name.trim()) d.name = d.areas[0] || d.city;
    onSave(d);
    setEditing(null); setDraft(null);
  };

  return (
    <div className="page">
      <div className="row page-head" style={{ alignItems: "flex-end" }}>
        <div className="grow">
          <h2>{L.filters_title}</h2>
          <p>{L.filters_sub}</p>
        </div>
        <Btn variant="primary" icon="plus" onClick={openNew}>{L.new_filter}</Btn>
      </div>

      {filters.length === 0 ? (
        <div className="panel"><EmptyState icon="sliders" title={L.no_filters_t} text={L.no_filters_p}
          action={<Btn variant="primary" icon="plus" onClick={openNew}>{L.new_filter}</Btn>} /></div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {filters.map((f) => (
            <div className={`filter-card${f.active ? "" : " off"}`} key={f.id}>
              <div className="filter-ico"><Icon name={f.fcfsOnly ? "zap" : "layers"} /></div>
              <div className="filter-meta">
                <h4>{f.name}
                  {f.active ? <Badge kind="fcfs" icon="dot">{L.active}</Badge> : <Badge icon="dot">{L.paused}</Badge>}
                </h4>
                <div className="filter-crit">
                  <span className="crit"><Icon name="pin" />{f.areas.length ? f.areas.join(", ") : f.city}</span>
                  <span className="crit"><Icon name="coins" />{fmtKr(f.rentMin)}–{fmtKr(f.rentMax)}</span>
                  <span className="crit"><Icon name="bed" />{f.roomsMin}–{f.roomsMax} {L.room}</span>
                  <span className="crit"><Icon name="ruler" />{f.sqmMin}–{f.sqmMax} {L.sqm}</span>
                  {f.fcfsOnly && <span className="crit" style={{ color: "var(--accent-dim)" }}><Icon name="zap" />{L.fcfs_short}</span>}
                </div>
              </div>
              <div className="filter-stat only-desktop">
                <div className="n num">{f.matches7d ?? estimateMatches(f)}</div>
                <div className="l">{lang === "sv" ? "träffar / 7 d" : "matches / 7d"}</div>
              </div>
              <div className="filter-actions">
                <Switch on={f.active} onChange={() => onToggle(f.id)} label={L.active} />
                <IconBtn name="edit" label={L.edit} onClick={() => openEdit(f)} />
                <IconBtn name="trash" label={L.delete} onClick={() => setConfirmDel(f)} />
              </div>
            </div>
          ))}
        </div>
      )}

      {editing && draft && (
        <Modal title={editing === "new" ? L.new_filter : L.edit_filter} icon="sliders"
               onClose={() => { setEditing(null); setDraft(null); }}
               footer={<>
                 <div className="grow" />
                 <Btn variant="quiet" onClick={() => { setEditing(null); setDraft(null); }}>{L.cancel}</Btn>
                 <Btn variant="primary" icon="check" onClick={save}>{editing === "new" ? L.create : L.save}</Btn>
               </>}>
          <FilterFormBody lang={lang} value={draft} onChange={setDraft} />
        </Modal>
      )}

      {confirmDel && (
        <Modal title={L.delete_filter_q} icon="trash" max={440}
               onClose={() => setConfirmDel(null)}
               footer={<>
                 <div className="grow" />
                 <Btn variant="quiet" onClick={() => setConfirmDel(null)}>{L.cancel}</Btn>
                 <Btn variant="danger" icon="trash" onClick={() => { onDelete(confirmDel.id); setConfirmDel(null); }}>{L.delete}</Btn>
               </>}>
          <p className="muted">{L.delete_filter_p}</p>
          <div className="filter-card" style={{ boxShadow: "none" }}>
            <div className="filter-ico"><Icon name="layers" /></div>
            <div className="filter-meta"><h4>{confirmDel.name}</h4>
              <div className="filter-crit"><span className="crit"><Icon name="pin" />{confirmDel.areas.join(", ") || confirmDel.city}</span></div>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* -------------------------------------------------------------- Dashboard */
function Dashboard({ lang, feed, now, wsState, paused, soundOn, setSoundOn,
                    filters, onOpenListing, onRetry, onCreateFilter, contentSel = ".content" }) {
  const L = STRINGS[lang];
  const [q, setQ] = React.useState("");
  const [fcfsOnly, setFcfsOnly] = React.useState(false);
  const [unseen, setUnseen] = React.useState(0);
  const prevLen = React.useRef(feed.length);

  const activeFilters = filters.filter((f) => f.active).length;

  const filtered = React.useMemo(() => feed.filter((l) => {
    if (fcfsOnly && !l.fcfs) return false;
    if (q) {
      const s = (l.street + " " + l.area + " " + l.city).toLowerCase();

<script type="text/babel">
/* app.jsx — root: routing, shell, live WS simulation, tweaks */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#15b878",
  "theme": "light",
  "view": "comfort",
  "density": "cozy",
  "card": "card",
  "feedFeel": "urgency",
  "lang": "sv",

}/*EDITMODE-END*/;

const ACCENTS = ["#15b878", "#2f74e0", "#7a5cf0", "#e8893a", "#e2566f", "#0fb5c4"];

function luminance(hex) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.replace(/./g, (c) => c + c) : h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

let _ac = null;
function playBlip(feel) {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = _ac.currentTime;
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = "sine";
    const f1 = feel === "terminal" ? 880 : feel === "calm" ? 523 : 740;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f1 * 1.5, t0 + 0.08);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(feel === "calm" ? 0.06 : 0.12, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o.connect(g); g.connect(_ac.destination);
    o.start(t0); o.stop(t0 + 0.24);
  } catch (e) { /* noop */ }
}
