# Render Blueprint — beta. Importera i Render: New → Blueprint → välj repo.
# Pollern körs som schemalagd cron (se .github/workflows/poll-homeq.yml) eller som en
# Render Cron Job / Background Worker (betald plan): python -m poller.main --once
services:
  - type: web
    name: hqrtm-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Bygg om endast vid kodändringar — INTE vid cron-pushar av vitrinens sample-listings.js.
    buildFilter:
      paths:
        - "web/**"
        - "shared/**"
        - "Dockerfile"
        - "pyproject.toml"
        - "render.yaml"
    envVars:
      - key: MONGO_URI            # MongoDB Atlas (M0 free = replica set, krävs för Change Streams)
        sync: false               # sätts manuellt i Render-dashboarden (hemlighet)
      - key: MONGO_DB
        value: hqrtm
      - key: SECRET_KEY
        generateValue: true       # Render genererar ett säkert värde
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: COOKIE_SECURE          # HTTPS i prod → Secure httpOnly-cookies för JWT
        value: "true"
      - key: RATELIMIT_STORAGE_URI  # Redis för delade rate-limit-räknare över processer (valfritt)
        sync: false                 # t.ex. rediss://… ; tom → in-memory per process
      - key: LOG_JSON
        value: "true"
      - key: WEB_WORKERS
        value: "2"
      - key: WEB_THREADS
        value: "8"
      - key: TELEGRAM_BOT_USERNAME  # för deep-link i /api/telegram/link
        sync: false

