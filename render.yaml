# Render Blueprint — beta. Importera i Render: New → Blueprint → välj repo.
# Pollern körs som schemalagd cron (se .github/workflows/poll-homeq.yml) eller som en
# Render Cron Job / Background Worker (betald plan): python -m poller.main --once
services:
  - type: web
    name: hqrtm-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGO_URI            # MongoDB Atlas (M0 free = replica set, krävs för Change Streams)
        sync: false               # sätts manuellt i Render-dashboarden (hemlighet)
      - key: MONGO_DB
        value: hqrtm
      - key: SECRET_KEY
        generateValue: true       # Render genererar ett säkert värde
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: WEB_WORKERS
        value: "2"
      - key: WEB_THREADS
        value: "8"
      - key: TELEGRAM_BOT_USERNAME  # för deep-link i /api/telegram/link
        sync: false

  # Telegram-bot (long-polling). ⚠️ Background Worker kräver betald Render-plan (ingen free worker).
  - type: worker
    name: hqrtm-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m bot.main
    plan: starter
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: hqrtm
      - key: TELEGRAM_BOT_TOKEN     # från @BotFather
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: LOG_JSON
        value: "true"
