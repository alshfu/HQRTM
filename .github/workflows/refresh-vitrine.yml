name: refresh-vitrine

# Auto-uppdatera skyltfönstrets urval var 0,1 timme (6 minuter) med RIKTIGA Göteborg-annonser
# från HomeQ:s publika Card Search. Pushar uppdaterad sample-listings.js → GitHub Pages bygger om.
#
# ⚠️ Detta är återkommande automatiserad åtkomst till HomeQ:s publika API. Per körning hämtas bara
# tills 12 träffar (≈1–3 förfrågningar). 24/7-polling i produkten + landlord-JWT är fortsatt gated
# på ToS (COMPLIANCE.md). Obs: GitHub kan fördröja schemalagda körningar och pausar schemat efter
# 60 dagars repo-inaktivitet; GitHub Pages har en mjuk gräns på ~10 byggen/timme.

on:
  schedule:
    - cron: "*/6 * * * *"   # var 6:e minut = 0,1 timme
  workflow_dispatch: {}      # tillåt manuell körning

permissions:
  contents: write

concurrency:
  group: refresh-vitrine
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden (minimalt för generatorn)
        run: pip install httpx "pydantic[email]" pydantic-settings python-dotenv

      - name: Hämta riktiga annonser (HomeQ, Göteborg)
        run: python -m scripts.gen_sample_listings

      - name: Committa & pusha om data ändrats
        run: |
          if git diff --quiet -- HQRTM-Demo/sample-listings.js; then
            echo "Inga ändringar i urvalet — hoppar över commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HQRTM-Demo/sample-listings.js
          git commit -m "chore(vitrine): auto-uppdatera Göteborg-annonser [skip ci]"
          git pull --rebase origin main
          git push
