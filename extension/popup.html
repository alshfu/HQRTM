<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<style>
  :root { --accent:#15b878; --bg:#0c0f0e; --panel:#141917; --line:#ffffff1a; --text:#eef2f0; --muted:#9aa6a1; }
  * { box-sizing:border-box; margin:0; }
  body { width:360px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:14px; }
  h1 { font-size:15px; display:flex; align-items:center; gap:7px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  input, textarea { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px; font-size:13px; margin-top:4px; font-family:inherit; }
  button { background:var(--accent); color:#04140d; border:0; border-radius:8px; padding:8px 12px; font-weight:600; font-size:13px; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; }
  .hidden { display:none; }
  section { margin-top:14px; }
  .tabs { display:flex; gap:6px; margin-top:10px; }
  .tab { flex:1; text-align:center; padding:6px; border-radius:8px; background:var(--panel); border:1px solid var(--line); font-size:12px; cursor:pointer; }
  .tab.on { border-color:var(--accent); color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
  .card h3 { font-size:13px; }
  .card .meta { font-size:11.5px; color:var(--muted); margin:3px 0 7px; }
  .list { max-height:300px; overflow:auto; margin-top:8px; }
  label { font-size:12px; color:var(--muted); display:block; margin-top:8px; }
  .err { color:#e8675a; font-size:12px; margin-top:6px; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <h1><span class="dot"></span> HQRTM Snabbansök</h1>

  <!-- Inloggning -->
  <section id="login">
    <p class="muted">Logga in på ditt HQRTM-konto. Token sparas <b>lokalt</b> i webbläsaren.</p>
    <label>Inloggning / e-post</label><input id="email" autocomplete="username">
    <label>Lösenord</label><input id="password" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:10px"><button id="loginBtn">Logga in</button>
      <span class="muted">eller <a href="https://hqrtm.onrender.com/register" target="_blank">skapa konto</a></span></div>
    <div id="loginErr" class="err hidden"></div>
  </section>

  <!-- Inloggad -->
  <section id="app" class="hidden">
    <div class="row" style="justify-content:space-between">
      <span class="muted" id="who"></span>
      <button class="ghost" id="logoutBtn" style="padding:4px 8px">Logga ut</button>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="matches">Matchningar</div>
      <div class="tab" data-tab="profile">Profil</div>
    </div>

    <div id="tab-matches">
      <div id="matchInfo" class="muted" style="margin-top:8px">Laddar…</div>
      <div id="list" class="list"></div>
    </div>

    <div id="tab-profile" class="hidden">
      <p class="muted" style="margin-top:8px">Sparas lokalt + på ditt konto. Används av autofyll på annonssidor.</p>
      <label>Presentation (om dig)</label><textarea id="p_presentation" rows="3"></textarea>
      <label>Sysselsättning</label><input id="p_occupation">
      <label>Månadsinkomst (kr)</label><input id="p_income" type="number">
      <label>Telefon</label><input id="p_phone">
      <label>Hushåll</label><input id="p_household">
      <label>Önskad inflytt</label><input id="p_move_in">
      <div class="row" style="margin-top:10px"><button id="saveProfile">Spara profil</button>
        <span id="profileMsg" class="muted"></span></div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
